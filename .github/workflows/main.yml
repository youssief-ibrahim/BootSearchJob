
name: DotNet Job Hunter

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      JobHunter__RunOnce: "true"
      ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION }}
      Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      Telegram__ChatId: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore DotNetJobHunter.csproj

      - name: Build project
        run: dotnet build DotNetJobHunter.csproj --configuration Release --no-restore

      - name: Run Job Hunter once
        run: dotnet run --project DotNetJobHunter.csproj --configuration Release --no-build
