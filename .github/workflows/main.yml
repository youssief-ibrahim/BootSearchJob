
name: DotNet Job Hunter

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    env:
      JobHunter__RunOnce: "true"
      ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION }}
      Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      Telegram__ChatId: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.4"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Run Job Hunter once
        run: dotnet run --configuration Release --no-build
